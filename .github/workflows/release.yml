name: Build and release desktop
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            arch: x64
          - os: ubuntu-22.04
            platform: linux
            arch: x64
          - os: macos-15
            platform: mac
            arch: arm64
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Prepare macOS icon
        if: matrix.platform == 'mac'
        run: |
          mkdir -p /tmp/Gree.iconset
          for size in 16 32 128 256 512; do
            sips -z "$size" "$size" public/app-icon.png --out "/tmp/Gree.iconset/icon_${size}x${size}.png" >/dev/null
            double=$((size * 2))
            sips -z "$double" "$double" public/app-icon.png --out "/tmp/Gree.iconset/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns /tmp/Gree.iconset -o assets/app.icns
      - name: Package native binaries
        run: npx electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never
      - name: Runtime smoke on Linux
        if: matrix.platform == 'linux'
        run: xvfb-run -a node_modules/.bin/electron scripts/platform-smoke.cjs
      - name: Runtime smoke on Windows and macOS
        if: matrix.platform != 'linux'
        run: npx electron scripts/platform-smoke.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.dmg
            release/*.zip
            .cache/platform-smoke.json
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - name: Publish verified build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p publish
          find packages -type f \( -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.dmg' -o -name '*.zip' \) -exec cp {} publish/ \;
          (cd publish && sha256sum * > SHA256SUMS.txt)
          gh release create "$GITHUB_REF_NAME" publish/* --title "Gree Desktop ${GITHUB_REF_NAME#v}" --notes-file "PATCH_NOTES_${GITHUB_REF_NAME#v}.md"
